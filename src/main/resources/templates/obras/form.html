<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Nova Obra - ObraFuturo</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">ObraFuturo</a>
        <div>
            <a class="nav-link text-white" th:href="@{/obras}">Obras</a>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-3" th:text="${titulo}">Nova obra</h2>


    <form th:action="${obraId} == null ? @{/obras} : @{'/obras/' + ${obraId}}"
          th:object="${obraRequest}"
          method="post"
          class="row g-3">

        <div class="col-md-6">
            <label class="form-label">Nome</label>
            <input type="text" th:field="*{nome}" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('nome')}"
                 th:errors="*{nome}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">CNPJ (14 dígitos)</label>
            <input type="text" th:field="*{cnpj}" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('cnpj')}"
                 th:errors="*{cnpj}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Logradouro</label>
            <input type="text" th:field="*{logradouro}" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('logradouro')}"
                 th:errors="*{logradouro}"></div>
        </div>

        <div class="col-md-2">
            <label class="form-label">Número</label>
            <input type="text" th:field="*{numero}" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('numero')}"
                 th:errors="*{numero}"></div>
        </div>

        <div class="col-md-4">
            <label class="form-label">Cidade</label>
            <input type="text" th:field="*{cidade}" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('cidade')}"
                 th:errors="*{cidade}"></div>
        </div>

        <div class="col-md-2">
            <label class="form-label">Estado</label>
            <input type="text" th:field="*{estado}" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('estado')}"
                 th:errors="*{estado}"></div>
        </div>

        <div class="col-md-4">
            <label class="form-label">CEP</label>
            <input type="text" th:field="*{cep}" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('cep')}"
                 th:errors="*{cep}"></div>
        </div>

        <div class="col-md-3">
            <label class="form-label">Data início</label>
            <input type="date" th:field="*{dataInicio}" class="form-control">
        </div>

        <div class="col-md-3">
            <label class="form-label">Data fim</label>
            <input type="date" th:field="*{dataFim}" class="form-control">
        </div>

        <div class="col-md-3">
            <label class="form-label">Ativa?</label>
            <select th:field="*{ativa}" class="form-select">
                <option th:value="true">Sim</option>
                <option th:value="false">Não</option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('ativa')}"
                 th:errors="*{ativa}"></div>
        </div>

        <div class="col-12 mt-3">
            <button class="btn btn-primary" type="submit"
                    th:text="${acao}">Salvar</button>
            <a class="btn btn-secondary" th:href="@{/obras}">Cancelar</a>
        </div>
    </form>
</div>

</body>
</html>
