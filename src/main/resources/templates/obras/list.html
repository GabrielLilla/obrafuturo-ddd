<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Obras - ObraFuturo</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">ObraFuturo</a>
        <div>
            <a class="nav-link text-white" th:href="@{/obras}">Obras</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Obras cadastradas</h2>
        <a class="btn btn-primary" th:href="@{/obras/nova}">Nova obra</a>
    </div>

    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>CNPJ</th>
            <th>Cidade</th>
            <th>UF</th>
            <th>Ativa</th>
            <th class="text-end">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="obra : ${obras}">
            <td th:text="${obra.id}">1</td>
            <td th:text="${obra.nome}">Nome</td>
            <td th:text="${obra.cnpj}">00000000000000</td>
            <td th:text="${obra.cidade}">Cidade</td>
            <td th:text="${obra.estado}">SP</td>
            <td>
                <span th:text="${obra.ativa} ? 'Sim' : 'Não'"></span>
            </td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-primary me-2"
                   th:href="@{'/obras/' + ${obra.id} + '/editar'}">
                    Editar
                </a>

                <form th:action="@{'/obras/' + ${obra.id} + '/excluir'}"
                      method="post" style="display:inline;"
                      onsubmit="return confirm('Tem certeza que deseja excluir esta obra?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                        Excluir
                    </button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(obras)}">
            <td colspan="7" class="text-center">Nenhuma obra cadastrada.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
